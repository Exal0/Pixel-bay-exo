<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    # Configuration du proxy pour PhpMyAdmin
    ProxyPreserveHost On
    ProxyRequests Off

    # Redirection automatique de /phpmyadmin vers /phpmyadmin/
    RedirectMatch ^/phpmyadmin$ /phpmyadmin/

    # Redirection de /phpmyadmin/ vers le conteneur PhpMyAdmin
    ProxyPass /phpmyadmin/ http://phpmyadmin:80/
    ProxyPassReverse /phpmyadmin/ http://phpmyadmin:80/

    # Configuration des headers pour PhpMyAdmin
    <Location "/phpmyadmin/">
        ProxyPassReverse /
        SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    </Location>

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Configuration PHP
    <FilesMatch "\.php$">
        SetHandler application/x-httpd-php
    </FilesMatch>

    # Logs
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
</VirtualHost>
